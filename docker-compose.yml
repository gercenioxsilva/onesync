services:
  db:
    image: ${REGISTRY_PREFIX:-mirror.gcr.io/library/}postgres:16-alpine
    container_name: people_app_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=people_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-mirror.gcr.io/library/}
    container_name: people_app_backend
    working_dir: /app
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/people_db
      - ENVIRONMENT=local
      - ENABLE_SCHEMA_AUTOCREATE=true
      - CORS_ORIGINS=["http://localhost:5173"]
      - TRACKER_CSV_PATH=/data/01_TRACKER_TIME.csv
      - PEOPLE_SOURCE_DIR=/workspace-data
      - AUTH_SECRET_KEY=local-dev-secret-key-change-me
      - AUTH_BOOTSTRAP_ENABLED=true
      - AUTH_BOOTSTRAP_OWNER_EMAIL=admin@people.local
      - AUTH_BOOTSTRAP_OWNER_PASSWORD=admin123
      - AUTH_BOOTSTRAP_PLAN=FREE
    volumes:
      - ./backend:/app
      - ../01_TRACKER_TIME.csv:/data/01_TRACKER_TIME.csv:ro
      - ../:/workspace-data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-mirror.gcr.io/library/}
    container_name: people_app_frontend
    working_dir: /app
    command: sh -c "npm install ; npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_API_URL=http://localhost:8000/api
      - VITE_AUTH_EMAIL=admin@people.local
      - VITE_AUTH_PASSWORD=admin123
    depends_on:
      - backend

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-mirror.gcr.io/library/}
    container_name: people_app_seed
    working_dir: /app
    command: python -m app.scripts.seed_collaborators
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/people_db
      - TRACKER_CSV_PATH=/data/01_TRACKER_TIME.csv
      - PEOPLE_SOURCE_DIR=/workspace-data
    volumes:
      - ./backend:/app
      - ../01_TRACKER_TIME.csv:/data/01_TRACKER_TIME.csv:ro
      - ../:/workspace-data:ro
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
