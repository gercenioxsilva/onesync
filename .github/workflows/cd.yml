name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
       github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: true

    env:
      AWS_REGION: us-east-1
      PROJECT: onesync
      ENVIRONMENT: mvp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Descobre os valores de infra consultando os recursos AWS diretamente
      # pelas tags e nomes definidos pelo Terraform. Não depende de SSM Parameters
      # nem de nenhum terraform apply adicional — funciona com a infra já existente.
      - name: Discover infrastructure config from AWS
        id: config
        run: |
          PREFIX="${PROJECT}-${ENVIRONMENT}"

          fail() { echo "::error::$1"; exit 1; }
          none() { [ -z "$1" ] || [ "$1" = "None" ]; }

          # ECR — nome determinístico: {prefix}-backend
          ECR_REGISTRY=$(aws ecr describe-repositories \
            --repository-names "${PREFIX}-backend" \
            --query 'repositories[0].repositoryUri' \
            --output text) \
            || fail "ECR '${PREFIX}-backend' não encontrado."

          # S3 — tem sufixo aleatório, identifica pela tag Name={prefix}-frontend
          FRONTEND_BUCKET_ARN=$(aws resourcegroupstaggingapi get-resources \
            --tag-filters "Key=Name,Values=${PREFIX}-frontend" \
            --resource-type-filters "s3:bucket" \
            --query 'ResourceTagMappingList[0].ResourceARN' \
            --output text) \
            || fail "Erro ao buscar S3 bucket com tag Name=${PREFIX}-frontend."
          FRONTEND_BUCKET="${FRONTEND_BUCKET_ARN#arn:aws:s3:::}"
          none "$FRONTEND_BUCKET" && fail "S3 bucket com tag Name=${PREFIX}-frontend não encontrado."

          # CloudFront — a tagging API é instável para serviços globais; busca pela
          # origem S3 (FRONTEND_BUCKET já foi resolvido acima)
          CLOUDFRONT_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Origins.Items[0].DomainName,'${FRONTEND_BUCKET}')].Id | [0]" \
            --output text) \
            || fail "Erro ao listar CloudFront distributions."
          none "$CLOUDFRONT_ID" && fail "CloudFront com origem S3 '${FRONTEND_BUCKET}' não encontrado. Verifique se o terraform apply foi concluído."

          # Domain — lê dos aliases da distribuição CloudFront
          DOMAIN_NAME=$(aws cloudfront get-distribution \
            --id "$CLOUDFRONT_ID" \
            --query 'Distribution.DistributionConfig.Aliases.Items[0]' \
            --output text) \
            || fail "Não foi possível obter o domain name do CloudFront $CLOUDFRONT_ID."
          none "$DOMAIN_NAME" && fail "CloudFront $CLOUDFRONT_ID não possui aliases configurados."

          # EC2 — tag Name={prefix}-backend, estado running
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=${PREFIX}-backend" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text) \
            || fail "Erro ao buscar instância EC2 '${PREFIX}-backend'."
          none "$INSTANCE_ID" && fail "EC2 '${PREFIX}-backend' (running) não encontrada."

          # Secrets Manager — nome: {prefix}/app-secrets
          SECRET_ARN=$(aws secretsmanager list-secrets \
            --filters "Key=name,Values=${PREFIX}/app-secrets" \
            --query 'SecretList[0].ARN' \
            --output text) \
            || fail "Erro ao buscar secret '${PREFIX}/app-secrets'."
          none "$SECRET_ARN" && fail "Secret '${PREFIX}/app-secrets' não encontrado."

          {
            echo "ecr_registry=$ECR_REGISTRY"
            echo "frontend_bucket=$FRONTEND_BUCKET"
            echo "cloudfront_id=$CLOUDFRONT_ID"
            echo "domain_name=$DOMAIN_NAME"
            echo "instance_id=$INSTANCE_ID"
            echo "secret_arn=$SECRET_ARN"
          } >> "$GITHUB_OUTPUT"

      # ── Backend ────────────────────────────────────────────────────────────────

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.config.outputs.ecr_registry }}:latest
            ${{ steps.config.outputs.ecr_registry }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ───────────────────────────────────────────────────────────────

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.${{ steps.config.outputs.domain_name }}/api

      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/dist \
            s3://${{ steps.config.outputs.frontend_bucket }} \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.config.outputs.cloudfront_id }} \
            --paths '/*'

      # ── EC2 restart via SSM Run Command (sem SSH, sem chave privada) ───────────

      - name: Restart backend on EC2 via SSM Run Command
        env:
          INSTANCE_ID: ${{ steps.config.outputs.instance_id }}
          SECRET_ARN: ${{ steps.config.outputs.secret_arn }}
          ECR_REGISTRY: ${{ steps.config.outputs.ecr_registry }}
          DOMAIN_NAME: ${{ steps.config.outputs.domain_name }}
        run: |
          # Escreve o script de restart usando heredoc literal (<<'ENDSCRIPT')
          # para evitar expansão local. Os placeholders são substituídos por
          # sed antes de enviar ao EC2, que os executa com sua IAM role.
          cat > /tmp/restart-backend.sh <<'ENDSCRIPT'
          #!/bin/bash
          set -euo pipefail

          SECRET_ARN="__SECRET_ARN__"
          ECR_REGISTRY="__ECR_REGISTRY__"
          DOMAIN_NAME="__DOMAIN_NAME__"
          REGION="__REGION__"

          echo "=== Buscando secrets do Secrets Manager ==="
          SECRETS=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --region  "$REGION" \
            --query SecretString --output text)

          DATABASE_URL=$(echo "$SECRETS"       | jq -r .DATABASE_URL)
          AUTH_SECRET_KEY=$(echo "$SECRETS"    | jq -r .AUTH_SECRET_KEY)
          BOOTSTRAP_EMAIL=$(echo "$SECRETS"    | jq -r .BOOTSTRAP_OWNER_EMAIL)
          BOOTSTRAP_PASSWORD=$(echo "$SECRETS" | jq -r .BOOTSTRAP_OWNER_PASSWORD)
          GOOGLE_CLIENT_ID=$(echo "$SECRETS"   | jq -r .GOOGLE_CLIENT_ID)

          echo "=== Autenticando no ECR ==="
          aws ecr get-login-password --region "$REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          echo "=== Pulling nova imagem ==="
          docker pull "$ECR_REGISTRY:latest"

          echo "=== Recriando container ==="
          docker rm -f onesync-backend || true
          docker run -d \
            --name onesync-backend \
            --restart unless-stopped \
            -p 8000:8000 \
            --log-driver awslogs \
            --log-opt awslogs-region="$REGION" \
            --log-opt awslogs-group=onesync-backend \
            --log-opt awslogs-stream=ec2-backend \
            -e DATABASE_URL="$DATABASE_URL" \
            -e ENVIRONMENT=production \
            -e CORS_ORIGINS="[\"https://$DOMAIN_NAME\",\"https://www.$DOMAIN_NAME\"]" \
            -e AUTH_SECRET_KEY="$AUTH_SECRET_KEY" \
            -e AUTH_BOOTSTRAP_ENABLED=true \
            -e AUTH_BOOTSTRAP_OWNER_EMAIL="$BOOTSTRAP_EMAIL" \
            -e AUTH_BOOTSTRAP_OWNER_PASSWORD="$BOOTSTRAP_PASSWORD" \
            -e AUTH_BOOTSTRAP_PLAN=FREE \
            -e AUTH_BOOTSTRAP_IMPORT_COLLABORATORS=false \
            -e ENABLE_SCHEMA_AUTOCREATE=false \
            -e GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            "$ECR_REGISTRY:latest"

          echo "=== Backend reiniciado com sucesso ==="
          ENDSCRIPT

          # Injeta os valores reais nos placeholders
          sed -i \
            -e "s|__SECRET_ARN__|${SECRET_ARN}|g" \
            -e "s|__ECR_REGISTRY__|${ECR_REGISTRY}|g" \
            -e "s|__DOMAIN_NAME__|${DOMAIN_NAME}|g" \
            -e "s|__REGION__|${AWS_REGION}|g" \
            /tmp/restart-backend.sh

          # Empacota como JSON para o SSM
          PARAMS=$(jq -n --arg script "$(cat /tmp/restart-backend.sh)" '{"commands":[$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 300 \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Aguarda conclusão (poll a cada 10s, máx 5 min)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "[${i}/30] Status: $STATUS"
            case "$STATUS" in
              Success)
                echo "--- STDOUT ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text
                exit 0 ;;
              Failed|Cancelled|TimedOut|Undeliverable|DeliveryTimedOut|ExecutionTimedOut)
                echo "--- STDERR ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text >&2
                exit 1 ;;
            esac
            sleep 10
          done

          echo "Timeout aguardando SSM command (5 min)." >&2
          exit 1
